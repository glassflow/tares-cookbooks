[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navflow-cookbooks"
version = "0.1.0"
description = "Companion cookbooks: provider agents with their read path swapped for NavFlow"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "claude-agent-sdk>=0.1.51",
    "httpx>=0.27",
    "python-dotenv>=1.1.1",
    "ipykernel>=6.29",
]

[tool.hatch.build.targets.wheel]
packages = ["navflow"]
