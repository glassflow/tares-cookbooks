name: build platform image

# Publishes the AI-SRE cookbook's platform app as a multi-arch image so `docker compose up`
# is a pull, not a local build. The image serves both api-server and traffic-generator.

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/01_sre_incident_response/platform/app/**"
      - ".github/workflows/build-platform-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3       # emulation for arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/glassflow/tares-cookbooks-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: cookbooks/01_sre_incident_response/platform/app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
